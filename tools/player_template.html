<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMX 실물 로봇 영상 — PURPLE-SY (김승용)</title>
<meta name="description" content="OMX 로봇 팔 ACT 자율 구동, 녹화 리플레이, 부분 성공·실패, 텔레오퍼레이션 시연 영상">
<style>
:root{
  --bg:#f6f8fa; --surface:#ffffff; --ink:#1f2328; --ink2:#59636e; --line:#d1d9e0; --accent:#0969da;
  --act:#1a7f37; --replay:#0969da; --partial:#9a6700; --fail:#cf222e; --teleop:#8250df;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1117; --surface:#151b23; --ink:#f0f6fc; --ink2:#9198a1; --line:#3d444d; --accent:#4493f8;
    --act:#3fb950; --replay:#4493f8; --partial:#d29922; --fail:#f85149; --teleop:#ab7df8; color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;overflow-wrap:anywhere}
header{text-align:center;margin-bottom:18px}
header h1{font-size:1.5rem;margin:0 0 4px}
header .who{font-weight:600;margin:0}
header .tag{color:var(--ink2);margin:2px 0 8px;font-size:.92rem}
header a{color:var(--accent);text-decoration:none}
header a:hover{text-decoration:underline}
.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:22px}
.player video{display:block;width:100%;aspect-ratio:4/3;max-height:72vh;background:#000;border-radius:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.now{flex:1 1 260px;min-width:0}
.now h2{font-size:1.1rem;margin:0}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-right:6px;vertical-align:1px}
.c-act{color:var(--act)} .c-replay{color:var(--replay)} .c-partial{color:var(--partial)} .c-fail{color:var(--fail)} .c-teleop{color:var(--teleop)}
dl{display:grid;grid-template-columns:minmax(4.5em,max-content) minmax(0,1fr);gap:2px 12px;margin:8px 0 0;font-size:.92rem}
@media (max-width:480px){dl{grid-template-columns:minmax(0,1fr)} dt{margin-top:6px}}
dt{color:var(--ink2)} dd{margin:0;overflow-wrap:anywhere}
section h3{font-size:1rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
section h3 .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:block;text-align:left;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.card span{display:block;padding:6px 8px;font-size:.85rem;font-weight:600;overflow-wrap:anywhere}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
footer{color:var(--ink2);font-size:.82rem;margin-top:28px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OMX 실물 로봇 영상</h1>
    <p class="who">PURPLE-SY (김승용)</p>
    <p class="tag">Robotics · Physical AI — Robot Control · Imitation Learning · Real-world Validation</p>
    <a href="https://github.com/PURPLE-SY/omx-physical-ai-portfolio">← 포트폴리오 (GitHub)</a>
  </header>

  <div class="player">
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="bar">
      <button id="play" type="button">▶ 재생</button>
      <button id="full" type="button">⛶ 전체 화면</button>
      <div class="now"><h2 id="title"></h2></div>
    </div>
    <dl id="facts"></dl>
  </div>

  <div id="lists"></div>

  <footer>탑뷰 640×480 · H.264 · 소리 없음. ACT 자율 구동과 녹화 리플레이(정책 아님), 텔레오퍼레이션 시연(사람이 조작)을 구분해 표시합니다.<br>
  공개본 편집: 02·07·09는 실행 뒤 사람 손이 들어오는 마지막 구간을 잘라냈습니다.</footer>
</div>
<script>
const ITEMS = /*__DATA__*/[];
const ORDER = ["act","replay","partial","fail","teleop"];
const v = document.getElementById("v"), playBtn = document.getElementById("play"), fullBtn = document.getElementById("full");
const titleEl = document.getElementById("title"), factsEl = document.getElementById("facts"), lists = document.getElementById("lists");

function el(tag, attrs, text){ const e=document.createElement(tag); for(const k in (attrs||{})) e.setAttribute(k, attrs[k]); if(text!=null) e.textContent=text; return e; }

function select(id, autoplay){
  const it = ITEMS.find(x => x.id === id) || ITEMS[0];
  v.src = it.video; v.poster = it.thumb;
  titleEl.textContent = "";
  titleEl.append(el("span", {class:"badge c-"+it.cat}, it.catLabel), document.createTextNode(it.id + " · " + it.title));
  factsEl.textContent = "";
  for (const [k, val] of it.facts){ factsEl.append(el("dt", null, k), el("dd", null, val)); }
  document.querySelectorAll(".card").forEach(c => c.setAttribute("aria-current", c.dataset.id === it.id ? "true" : "false"));
  document.title = it.id + " · " + it.title + " — OMX 실물 로봇 영상";
  const u = new URL(location.href); u.searchParams.set("v", it.id); history.replaceState(null, "", u);
  if (autoplay) v.play().catch(() => {});
}

for (const cat of ORDER){
  const group = ITEMS.filter(x => x.cat === cat); if (!group.length) continue;
  const sec = el("section"); const h = el("h3", {class:"c-"+cat}); h.append(el("span",{class:"dot"}), document.createTextNode(group[0].catLabel));
  const grid = el("div", {class:"grid"});
  for (const it of group){
    const b = el("button", {class:"card", type:"button", "data-id": it.id, "aria-label": it.id + " " + it.title + " 재생"});
    const img = el("img", {src: it.thumb, alt: "", loading: "lazy", width: "320", height: "240"});
    b.append(img, el("span", null, it.id + " · " + it.title));
    b.addEventListener("click", () => { select(it.id, true); window.scrollTo({top: 0, behavior: "smooth"}); });
    grid.append(b);
  }
  sec.append(h, grid); lists.append(sec);
}

playBtn.addEventListener("click", () => { v.paused ? v.play() : v.pause(); });
v.addEventListener("play", () => playBtn.textContent = "⏸ 일시정지");
v.addEventListener("pause", () => playBtn.textContent = "▶ 재생");
v.addEventListener("ended", () => playBtn.textContent = "▶ 재생");
fullBtn.addEventListener("click", () => {
  if (document.fullscreenElement) return document.exitFullscreen();
  if (v.requestFullscreen) v.requestFullscreen();
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();   // iOS Safari
  else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("button") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === " " || e.key === "k") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (e.key === "f") fullBtn.click();
});

select(new URLSearchParams(location.search).get("v"), false);
</script>
</body>
</html>
